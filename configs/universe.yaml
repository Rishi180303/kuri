# NSE Nifty 50 ticker universe with sector classifications.
#
# Snapshot date: 2026-04-28
# Source: NSE Nifty 50 constituents (https://www.nseindia.com/products-services/indices-nifty50-index)
# NOTE: NSE rebalances Nifty indices semi-annually (Mar/Sep). Refresh this
#       list on rebalance and bump `as_of` below; bumping the date is what
#       triggers any downstream "is the universe stale?" check.
#
# yfinance requires the ".NS" suffix for NSE-listed equities. The suffix is
# applied at fetch time, not stored here.
#
# Sector taxonomy follows NSE's official classification. Some sectors are
# singletons (1 ticker only); cross-sectional sector-relative features will
# emit null for those rather than imputing degenerate zero-variance ranks.
#
# KNOWN GAP: Tata Motors is excluded. `TATAMOTORS.NS` is gone from Yahoo
# (404) since the demerger; the Nifty 50 seat is now TMPV (passenger
# vehicles), with TMCV (commercial vehicles) listed separately 2025-11-12.
# Checked 2026-09-19: `TMPV.NS` serves full history back to 2018-01-01, so
# the feed is no longer the blocker and no NSE-direct fetcher is needed.
# Two things still block re-admission, both belonging to the next retrain:
#   1. yfinance does NOT adjust for the spin-off. Close goes 660.75 -> 395.45
#      on the 2025-10-14 ex-date and adj_close carries the same -40% step,
#      which is not a real loss (holders received TMCV shares). Pre-ex-date
#      prices need a manual demerger factor before any feature or label
#      touches them.
#   2. Universe membership feeds every cross-sectional feature, so adding a
#      ticker under the frozen fold models changes their inputs. Re-admit
#      only together with a full walk-forward retrain.

